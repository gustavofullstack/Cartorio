# pre-commit hooks for Cartorio Chatbot (G6.A.T6)
#
# Install:
#   uv tool install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Speed target: < 5s per file (ruff = ms, mypy selective = s)
# Modified by Gustavo Almeida + Pietra orquestrador.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint backend)
        entry: cd backend && uv run ruff check . --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff format (backend)
        entry: cd backend && uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/.*\.py$

      - id: mypy-selective
        name: mypy (changed files only)
        entry: cd backend && uv run mypy app/ --follow-imports silent
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/app/.*\.py$

      - id: workflow-validator
        name: N8N workflow validator (G6.B.T1)
        entry: python3 scripts/n8n_workflow_validator.py
        language: system
        pass_filenames: false
        files: ^infra/n8n-workflows/.*\.json$

      - id: openapi-snapshot
        name: OpenAPI snapshot check (G6.A.T2)
        entry: python3 scripts/openapi_snapshot.py --check
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      - id: dns-check
        name: DNS checker (G6.D.T5)
        entry: python3 scripts/dns_health_check.py
        language: system
        pass_filenames: false

      - id: secrets-scan
        name: secrets scan (.env files)
        entry: python3 scripts/secrets_scan.py
        language: system
        pass_filenames: false

      - id: secrets-scan-compose
        name: Secrets scan compose (G8.23.T2) — literal_keys + gitleaks
        entry: python3 scripts/check_no_literal_keys_compose.py --severity critical --report-only
        language: system
        pass_filenames: false
        always_run: true