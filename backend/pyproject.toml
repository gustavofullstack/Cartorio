[project]
name = "cartorio-backend"
version = "0.1.0"
description = "API de regras cartorarias com audit log imutavel e PII scrubbing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.1",
    "httpx>=0.28.0",
    "fastmcp>=3.4.2",
    "pyjwt>=2.10.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "pytest[dev]>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "fakeredis>=2.26.0",
    "lupa>=2.0",  # A20: fakeredis lua support (eval usado em release_lock)
    "mutmut>=3.6.0",
    "pytest-xdist>=3.5.0",  # G6.A.T4: paraleliza suite (~30% mais rapido em 4 cores)
]
# F05 E2E suite (Playwright + chromium). SEPARADO de `dev` para nao
# inflar CI unit (~200MB+ do chromium + 60MB Playwright). Instalar
# apenas quando rodar `pytest -m e2e`. Em CI nightly, instalar com:
#   uv sync --extra e2e
# Binario do browser vive em ~/.cache/ms-playwright/ (NUNCA comitar).
e2e = [
    "playwright>=1.40,<2",
    "pytest-playwright>=0.5,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S-prefixed (Bandit): testes podem usar assert, hardcoded secrets, try-except-pass sem risco LGPD.
# alembic/versions: SQL raw, hardcoded credenciais em exemplos, linhas longas sao aceitas.
# middleware: try/except-pass usado para fail-open em rate-limit (S110).

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S110"]
"alembic/versions/*.py" = ["S608", "S104", "S105", "E501"]
"backend/alembic/versions/*.py" = ["S608", "S104", "S105", "E501"]
"app/middleware/*.py" = ["S110"]

[tool.coverage.run]
omit = [
    "app/api/v1/whatsapp.py",
    "app/api/v1/telegram.py",
    "app/api/v2/*",
    "app/integrations/*",
    "app/core/*",
    "app/services/cartorio_agent.py",
    "app/services/chat_pipeline.py",
    "app/services/chatwoot_handoff.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term --cov-fail-under=90 -m 'not smoke and not integration and not e2e'"
asyncio_mode = "auto"
markers = [
    "smoke: integration tests against real infrastructure (requires SMOKE_TARGET=prod)",
    "integration: integration tests against real services (requires network access to VPS)",
    "e2e: end-to-end tests via Playwright (requires E2E_BASE_URL + chromium binary)",
    "t024: regression test for retro-editing mid-chain",
    "t025: test for HMAC key rotation",
    "t036: test for retention of conversa >365d",
    "t037: test for retention of conversa without client",
    "t043: test for emolumento value below minimum",
    "t044: test for emolumento value above teto",
    "t045: test for emolumento isencao",
    "t046: regression test for GET /api/v1/protocolo/{numero} soft-delete + status coverage",
    "coupling: architecture coupling tests (AST inspection of layer imports — G8.11.T4)",
] 
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*:DeprecationWarning",
    "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:SelectableGroups dict interface is deprecated.*:DeprecationWarning",
    "ignore:API NAO respondeu em.*:UserWarning",
    "ignore:Playwright cache root ausente.*:UserWarning",
    "ignore:playwright CLI NAO encontrado.*:UserWarning",
]

[dependency-groups]
dev = [
    "fakeredis>=2.36.2",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

