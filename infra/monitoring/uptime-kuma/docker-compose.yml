services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cartorio_uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Sao_Paulo
      - UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN=false
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cartorio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`status.2notasudi.com.br`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      - "traefik.docker.network=cartorio"

volumes:
  uptime-kuma-data:

networks:
  cartorio:
    external: true
    name: cartorio