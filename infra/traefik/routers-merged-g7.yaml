# Owner:   cartorio-sre / cartorio-dev hybrid
#
# Este arquivo e o DROP-IN merge dos 3 routers pendentes (chatwoot / n8n / supabase)
# no dynamic config EasyPanel Traefik. NAO e o dynamic config ativo do VPS.
#
# Pre-requisitos (ordem):
#   1. Cloudflare A records (G7.12.T1) — ver infra/dns/CLOUDFLARE_RUNBOOK.md
#      dig +short chatwoot.2notasudi.com.br A  → 187.77.236.77 ou CF anycast
#   2. Serviços Swarm UP: cartorio_chatwoot, cartorio_n8n, cartorio_supabase
#   3. Backup do dynamic atual no VPS
#
# Merge no VPS (Gustavo / SRE com SSH):
#   1. cp /etc/traefik/dynamic/main.yaml{,.bak-$(date +%Y%m%d)}
#   2. Mergear chaves sob http.routers e http.services (nao sobrescrever routers
#      existentes de api/flow/whatsapp/chat/agent/supbase/easypanel).
#   3. Validar YAML + traefik --check (ou restart controlado do container)
#   4. SIGHUP Traefik: docker kill -s HUP easypanel-traefik
#   5. curl -sk -o /dev/null -w "%{http_code}\n" https://chatwoot.2notasudi.com.br/
#
# Cross-refs:
#   - docs/TRAEFIK_ROUTERS_MERGE_G7.md
#   - docs/DNS_TRAEFIK_SUI_PACK_G7.md
#   - infra/dns/CLOUDFLARE_DNS_RECORDS.md
#   - infra/dns/DOMAIN_TYPO_DECISION.md  (supabase = opcional; supbase canônico)
#   - docs/PLAYBOOK_502_VS_NXDOMAIN_G7.md
#
# Middlewares referenciados (@file) devem existir no dynamic base EasyPanel.
# Se rate-limit-* nao existir no cluster, remover a linha middlewares ou criar
# stubs no main.yaml antes do merge.

http:
  routers:

    # ===== chatwoot.2notasudi.com.br =====
    # Backend: Chatwoot 3.x (servico: cartorio_chatwoot)
    # Porta interna Swarm: 3000
    cartorio-chatwoot:
      rule: "Host(`chatwoot.2notasudi.com.br`)"
      service: cartorio-chatwoot
      tls:
        certResolver: letsencrypt
      entryPoints:
        - websecure
      middlewares:
        - default-security-headers@file
        - rate-limit-anon@file

    # ===== n8n.2notasudi.com.br =====
    # Backend: N8N (servico: cartorio_n8n) — UI admin; flow.2notasudi.com.br pode ser canônico
    # Porta interna Swarm: 5678
    cartorio-n8n:
      rule: "Host(`n8n.2notasudi.com.br`)"
      service: cartorio-n8n
      tls:
        certResolver: letsencrypt
      entryPoints:
        - websecure
      middlewares:
        - default-security-headers@file
        - rate-limit-authenticated@file

    # ===== Supabase public aliases =====
    # `supbase` é o hostname canônico legado em produção; `supabase` é o
    # alias ortográfico planejado. O mesmo router cobre ambos para evitar que
    # a API (SUPABASE_URL) dependa de qual alias foi provisionado no DNS.
    # Porta interna Swarm: 8000 (Kong)
    cartorio-supabase:
      rule: "Host(`supbase.2notasudi.com.br`) || Host(`supabase.2notasudi.com.br`)"
      service: cartorio-supabase
      tls:
        certResolver: letsencrypt
      entryPoints:
        - websecure
      middlewares:
        - default-security-headers@file

  services:

    cartorio-chatwoot:
      loadBalancer:
        servers:
          - url: "http://cartorio_chatwoot:3000"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s

    cartorio-n8n:
      loadBalancer:
        servers:
          - url: "http://cartorio_n8n:5678"
        healthCheck:
          path: /healthz
          interval: 30s
          timeout: 5s

    cartorio-supabase:
      loadBalancer:
        servers:
          # Kong é o serviço `cartorio_supabase-kong`; `cartorio_supabase`
          # identifica a stack e não é um upstream HTTP confiável.
          - url: "http://cartorio_supabase-kong:8000"
        healthCheck:
          path: /auth/v1/health
          interval: 30s
          timeout: 5s
