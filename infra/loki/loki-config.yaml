# Loki config — Cartorio 2o Notas Uberlandia (G6.D.T5)
# Recebe logs de backend (stdout JSON) + N8N + API.
# Retention: 30 dias (LGPD alinhado com conversas IA 90d / audit 5y em DB).
# Storage: filesystem local (S3 opcional).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 744h  # 31 dias
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 dias
  max_query_parallelism: 32
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 24
  # Per-stream limits
  max_entries_limit_per_query: 5000

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Compactor (para retencao)
compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Ruler (alertas Loki - complemento ao Prometheus)
ruler:
  alertmanager_url: http://alertmanager:9093
  storage:
    type: local
    local:
      directory: /var/lib/loki/rules
  rule_path: /var/lib/loki/rules-tmp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Analytics tracking (opt-out - LGPD)
analytics:
  reporting_enabled: false

# Common labels para todas as series (facilita query Grafana)
common.ring:
  kvstore:
    store: inmemory