groups:
- name: cartorio-p0-critical
  interval: 1m
  rules:
  - alert: CartorioAPIDown
    expr: probe_success{job="cartorio-api"} == 0
    for: 1m
    labels:
      severity: critical
      priority: P0
      squad: cartorio-dev
    annotations:
      summary: API Cartório DOWN
      description: API em {{ $labels.instance }} não responde há mais de 1min.
      runbook: https://github.com/gustavofullstack/Cartorio/blob/master/docs/runbook/api-down.md
  - alert: CartorioAuditChainBroken
    expr: audit_dead_mans_status > 0
    for: 5m
    labels:
      severity: critical
      priority: P0
      squad: cartorio-lgpd
    annotations:
      summary: Audit Chain com problemas
      description: Dead man's switch acionado. Audit log pode estar parado.
  - alert: CartorioN8NDown
    expr: probe_success{job="cartorio-n8n"} == 0
    for: 2m
    labels:
      severity: critical
      priority: P0
      squad: cartorio-n8n
    annotations:
      summary: N8N DOWN
      description: N8N workflow engine não responde.
  - alert: CartorioServiceDown5Min
    expr: probe_success{job=~"cartorio-.*|n8n|evolution|chatwoot|openclaw|supabase|redis|dms"}
      == 0
    for: 5m
    labels:
      severity: critical
      priority: P0
      squad: cartorio-sre
    annotations:
      summary: Serviço do Cartório DOWN
      description: O serviço {{ $labels.job }} está fora do ar na VPS há mais de 5
        minutos.
- name: cartorio-p1-high
  interval: 2m
  rules:
  - alert: CartorioDBPoolExhausted
    expr: cartorio_db_pool_utilization_pct > 85
    for: 5m
    labels:
      severity: warning
      priority: P1
      squad: cartorio-dev
    annotations:
      summary: Pool DB com alta utilização
      description: Pool do banco está em {{ $value }}% de utilização.
  - alert: CartorioEvolutionDisconnected
    expr: evolution_connection_status{status="close"} == 1
    for: 1m
    labels:
      severity: warning
      priority: P1
      squad: cartorio-n8n
    annotations:
      summary: Evolution API desconectada
      description: Instância WhatsApp não está conectada.
  - alert: CartorioChatwootUnhealthy
    expr: chatwoot_api_status != 200
    for: 5m
    labels:
      severity: warning
      priority: P1
      squad: cartorio-n8n
    annotations:
      summary: Chatwoot com problemas
      description: Chatwoot API retornou status != 200.
- name: cartorio-p2-observability
  interval: 5m
  rules:
  - alert: CartorioClientesCountAnomaly
    expr: clientes_total < 1
    for: 30m
    labels:
      severity: info
      priority: P2
      squad: cartorio-dev
    annotations:
      summary: Nenhum cliente cadastrado
      description: Total de clientes está em 0 — possível perda de dados ou reset.
  - alert: CartorioProtocolosStale
    expr: time() - protocolo_last_update_timestamp > 86400
    for: 1h
    labels:
      severity: info
      priority: P2
      squad: cartorio-n8n
    annotations:
      summary: Nenhum protocolo novo em 24h
      description: Último protocolo foi criado há mais de 24h.
  - alert: CartorioBackupStale
    expr: time() - cartorio_backup_last_timestamp > 108000
    for: 1h
    labels:
      severity: warning
      priority: P2
      squad: cartorio-dev
    annotations:
      summary: Backup desatualizado
      description: Último backup foi há mais de 30h.
  - alert: CartorioAuditChainStagnant
    expr: audit_chain_length < (audit_chain_length offset 1h)
    for: 2h
    labels:
      severity: info
      priority: P2
      squad: cartorio-lgpd
    annotations:
      summary: Audit chain estagnada
      description: Audit chain não cresceu na última hora.
  - alert: CartorioTestCoverageLow
    expr: cartorio_test_coverage_pct < 85
    for: 24h
    labels:
      severity: info
      priority: P2
      squad: cartorio-dev
    annotations:
      summary: Cobertura de testes baixa
      description: 'Cobertura de testes está em {{ $value }}% (target: 90%).'
- name: cartorio-p2-product
  interval: 5m
  rules:
  - alert: CartorioLGPDConsentimentoBaixo
    expr: cartorio_consent_granted_ratio < 0.7
    for: 1h
    labels:
      severity: warning
      priority: P2
      squad: cartorio-lgpd
    annotations:
      summary: Taxa de consentimento LGPD baixo
      description: Apenas {{ $value | humanizePercentage }} dos clientes consentiram
        em {{ $labels.period }}. Esperado >70%. Pode indicar problema no banner de
        consentimento.
      runbook: https://github.com/gustavofullstack/Cartorio/blob/master/docs/runbook/lgpd-consent-low.md
  - alert: CartorioBackupFalhou
    expr: time() - cartorio_backup_last_success_timestamp > 86400
    for: 5m
    labels:
      severity: critical
      priority: P0
      squad: cartorio-sre
    annotations:
      summary: Backup do banco NAO executou em 24h
      description: Ultimo backup bem-sucedido foi ha mais de 24h. Verificar cron pg_basebackup
        e storage S3.
      runbook: https://github.com/gustavofullstack/Cartorio/blob/master/docs/runbook/backup-failed.md
  - alert: CartorioCircuitBreakerAberto
    expr: circuit_breaker_state{state="open"} > 0
    for: 5m
    labels:
      severity: warning
      priority: P1
      squad: cartorio-dev
    annotations:
      summary: Circuit breaker aberto para {{ $labels.provider }}
      description: Provider {{ $labels.provider }} com circuit breaker aberto ha mais
        de 5min. Fallback chain pode estar degradado.
      runbook: https://github.com/gustavofullstack/Cartorio/blob/master/docs/runbook/circuit-breaker.md
