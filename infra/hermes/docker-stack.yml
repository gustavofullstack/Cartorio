version: "3.8"

# Hermes Cartorio on the production Swarm.
#
# Deploy only after the external secrets listed in .env.example have been
# created in the Cartorio secret manager. This file never contains a token,
# password, Photon credential, or API key.
services:
  hermes:
    image: easypanel/cartorio/hermes@sha256:5545c1338d9f533a70356baa96be263786c12c4d4758f6c5275a9db1b553e357 # noqa: ALLOW_KEY_FALLBACK (digest imutavel da imagem, nao e segredo)
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /opt/data/config.yaml ]; then
          cp /run/configs/config.cartorio.yaml /opt/data/config.yaml
        fi
        exec /run/configs/lark-entrypoint.sh
    environment:
      HERMES_HOME: /opt/data
      HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:?set in the deployment environment}
      HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:?set in the deployment environment}
      FEISHU_DOMAIN: lark
      FEISHU_CONNECTION_MODE: websocket
      FEISHU_ALLOW_ALL_USERS: "true"
      FEISHU_GROUP_POLICY: open
      FEISHU_REQUIRE_MENTION: "false"
      FEISHU_ALLOW_BOTS: none
      MCP_CARTORIO_URL: http://cartorio_system-api:8000/mcp/
    configs:
      - source: hermes_cartorio_config_v1
        target: /run/configs/config.cartorio.yaml
        uid: "10000"
        gid: "10000"
        mode: 0440
      - source: hermes_lark_entrypoint_v4
        target: /run/configs/lark-entrypoint.sh
        uid: "10000"
        gid: "10000"
        mode: 0555
      - source: hermes_cartorio_soul_v2
        target: /run/configs/SOUL.md
        uid: "10000"
        gid: "10000"
        mode: 0440
      - source: hermes_public_output_guard_v1
        target: /run/configs/pietra-public-output.guard.py
        uid: "10000"
        gid: "10000"
        mode: 0444
      - source: hermes_public_output_plugin_v1
        target: /run/configs/pietra-public-output.__init__.py
        uid: "10000"
        gid: "10000"
        mode: 0444
      - source: hermes_public_output_manifest_v1
        target: /run/configs/pietra-public-output.plugin.yaml
        uid: "10000"
        gid: "10000"
        mode: 0444
      - source: hermes_public_profile_reconciler_v2
        target: /run/configs/reconcile_public_profile.py
        uid: "10000"
        gid: "10000"
        mode: 0444
    secrets:
      - hermes_minimax_api_key
      - hermes_mcp_cartorio_api_key
    volumes:
      - hermes_cartorio_data:/opt/data
    networks:
      - easypanel-cartorio
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

configs:
  hermes_cartorio_config_v1:
    file: ./config.cartorio.yaml
  hermes_lark_entrypoint_v4:
    file: ./lark-entrypoint.sh
  hermes_cartorio_soul_v2:
    file: ../openclaw-agent/workspace/SOUL.md
  hermes_public_output_guard_v1:
    file: ./plugins/pietra-public-output/public_output_guard.py
  hermes_public_output_plugin_v1:
    file: ./plugins/pietra-public-output/__init__.py
  hermes_public_output_manifest_v1:
    file: ./plugins/pietra-public-output/plugin.yaml
  hermes_public_profile_reconciler_v2:
    file: ./reconcile_public_profile.py

secrets:
  hermes_minimax_api_key:
    external: true
  hermes_mcp_cartorio_api_key:
    external: true
volumes:
  hermes_cartorio_data:

networks:
  easypanel-cartorio:
    external: true
