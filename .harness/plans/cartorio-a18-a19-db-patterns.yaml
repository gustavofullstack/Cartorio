  - id: a18-update-at-trigger
    title: "A18 Trigger update_at automático em todas tabelas com updated_at"
    prompt: >
      TASK A18 do Squad A (API/DB Hardening) — Cartório 2notas.

      CONTEXTO: API FastAPI em produção contra Supabase Postgres
      (cartorio_supabase-db-1). Algumas tabelas têm coluna `updated_at`
      mas sem trigger automático — campos não são atualizados em UPDATE,
      gerando dados stale em audit/observabilidade.

      OBJETIVO: Criar trigger BEFORE UPDATE que setta NEW.updated_at = NOW()
      em TODAS as tabelas que têm coluna `updated_at`. Idempotente
      (rodável múltiplas vezes). Migration Alembic versionada.

      PASSOS:

      1. **Auditoria inicial**:
         - Conectar cartorio_supabase-db-1 via Tailscale
         - Query: `SELECT table_name FROM information_schema.columns
           WHERE column_name = 'updated_at' AND table_schema = 'public';`
         - Listar todas as tabelas candidatas em
           `.harness/reins/cartorio-dev/memory/A18-audit.md`

      2. **Criar função trigger genérica** (se não existe):
         - `CREATE OR REPLACE FUNCTION set_updated_at()
           RETURNS TRIGGER AS $$
           BEGIN
             NEW.updated_at = NOW();
             RETURN NEW;
           END;
           $$ LANGUAGE plpgsql;`

      3. **Migration Alembic** (`backend/alembic/versions/<hash>_a18_update_at_triggers.py`):
         - Para cada tabela listada na auditoria:
           `CREATE TRIGGER set_updated_at BEFORE UPDATE ON <table>
           FOR EACH ROW EXECUTE FUNCTION set_updated_at();`
         - Usar `IF NOT EXISTS` para idempotência
         - `downgrade()` deve dropar os triggers

      4. **Aplicar migration no dev/staging local** (Tailscale VPS):
         - `cd backend && alembic upgrade head`
         - Validar via psql: `SELECT tgname FROM pg_trigger
           WHERE tgname = 'set_updated_at';`

      5. **Test pytest** (`tests/test_update_at_trigger.py`):
         - Cenário 1: UPDATE em tabela com trigger → updated_at muda
         - Cenário 2: UPDATE em tabela SEM trigger → updated_at não muda
         - Cenário 3: Migration é idempotente (rodar 2x, 2ª é no-op)
         - Cenário 4: Inserção (INSERT) NÃO dispara trigger
         - Coverage >= 90% no módulo de migration

      6. **MEMÓRIA** (`.harness/reins/cartorio-dev/memory/A18-update-at-trigger.md`):
         - Lista tabelas cobertas
         - Hash do commit migration
         - Output do alembic upgrade
         - Decisão: NÃO aplicar em prod ainda (push gate Lesson 110) —
           Gustavo autoriza deploy após review

      REGRAS DURAS:
      - NUNCA rotacionar chaves (regra Gustavo)
      - NUNCA push sem Gustavo GO (Lesson 110) — commit local OK
      - Conventional Commits (feat/test/docs) terminando com
        "Modified by Gustavo Almeida"
      - ruff check + ruff format clean
      - mypy default config 0 errors no código NOVO
      - pytest --cov=app coverage >= 90% no módulo novo
      - Workflow: analisar → testar → corrigir → melhorar → otimizar →
        documentar → comentar → salvar memória.

      REPORTE ao root session mvs_bafd4821e3d0473b97ede30210a95462 via
      `mavis communication send --from <sua-session> --to
      mvs_bafd4821e3d0473b97ede30210a95462 --command prompt` ao terminar.
      5 linhas: files_changed, tests_added, coverage, commit_hash, status.

      Push gate: NAO push. Apenas commit local.
    verify_prompt: >
      Verifique A18: 1. Função set_updated_at() criada (CREATE OR REPLACE
      FUNCTION)? 2. Migration Alembic gerada em
      backend/alembic/versions/? 3. Triggers aplicados em TODAS as tabelas
