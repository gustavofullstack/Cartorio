  - id: a19-soft-delete-pattern
    title: "A19 Soft delete pattern global deleted_at + filtro query"
    prompt: >
      TASK A19 do Squad A (API/DB Hardening) — Cartório 2notas.

      CONTEXTO: API FastAPI em produção. DELETE atual é HARD delete —
      remove registro do banco. Isso quebra audit chain (que precisa de
      evidência histórica) e LGPD art 18 V (eliminação só após retenção).

      OBJETIVO: Implementar soft delete pattern — coluna `deleted_at
      TIMESTAMPTZ NULL` em todas as tabelas de domínio (não em audit_log
      nem logs). DELETE vira UPDATE set deleted_at=NOW(). Queries de listagem
      filtram `WHERE deleted_at IS NULL` por padrão.

      PASSOS:

      1. **Auditoria** (`.harness/reins/cartorio-dev/memory/A19-audit.md`):
         - Listar tabelas de domínio (excluir audit_log, alembic_version,
           ref tables estáticas como uf, tipo_certidao)
         - Para cada uma, criar migration Alembic que adiciona coluna
           `deleted_at TIMESTAMPTZ NULL DEFAULT NULL`

      2. **SQLAlchemy mixin** (`backend/app/db.py` ou novo
      `backend/app/models/mixins.py`):
         - `class SoftDeleteMixin: deleted_at = Column(DateTime(timezone=True),
           nullable=True, default=None)`
         - Query helper: `def not_deleted(q): return q.filter(
           cls.deleted_at.is_(None))`
         - BaseRepository com `soft_delete()`, `restore()`, `find_active()`,
           `find_including_deleted()`

      3. **Atualizar routers/services** que fazem DELETE:
         - Trocar `db.delete(obj)` por `obj.deleted_at = datetime.utcnow();
           db.commit()`
         - Atualizar endpoints GET list → adicionar filtro
           `deleted_at IS NULL`
         - Manter endpoint opcional `?include_deleted=true` para admin
           (gated por permissão)

      4. **Migration Alembic** versionada em
      `backend/alembic/versions/<hash>_a19_soft_delete.py`:
         - Para cada tabela: `ALTER TABLE <table> ADD COLUMN IF NOT EXISTS
           deleted_at TIMESTAMPTZ NULL DEFAULT NULL;`
         - Idempotente (rodável múltiplas vezes)
         - `downgrade()` remove coluna

      5. **Test pytest** (`tests/test_soft_delete.py`):
         - Cenário 1: DELETE via endpoint setta deleted_at (não remove row)
         - Cenário 2: GET list exclui soft-deletados
         - Cenário 3: `?include_deleted=true` retorna todos
         - Cenário 4: Restore setta deleted_at = NULL
         - Cenário 5: Audit chain continua íntegra após soft delete
         - Coverage >= 90% no módulo novo

      6. **MEMÓRIA**:
         - `.harness/reins/cartorio-dev/memory/A19-soft-delete.md`
         - Lista tabelas alteradas
         - Hash do commit
         - Decisão: NÃO aplicar em prod sem Gustavo GO (Lesson 110)

      REGRAS DURAS:
      - NUNCA rotacionar chaves
      - NUNCA push sem Gustavo GO
      - Conventional Commits (feat/test/docs) terminando com
        "Modified by Gustavo Almeida"
      - ruff check + ruff format clean
      - mypy default config 0 errors
      - pytest --cov=app coverage >= 90%
      - Workflow canon: analisar → testar → corrigir → melhorar →
        otimizar → documentar → comentar → salvar memória.

      REPORTE ao root session mvs_bafd4821e3d0473b97ede30210a95462 via
      `mavis communication send --from <sua-session> --to
      mvs_bafd4821e3d0473b97ede30210a95462 --command prompt` ao terminar.
      5 linhas: files_changed, tests_added, coverage, commit_hash, status.

      Push gate: NAO push. Apenas commit local.
    verify_prompt: >
      Verifique A19: 1. Coluna deleted_at adicionada em TODAS as tabelas de
      domínio (verificar information_schema)? 2. SoftDeleteMixin +
      BaseRepository com soft_delete/restore/find_active implementados?
      3. Routers que faziam DELETE agora setam deleted_at?
      4. List queries filtram deleted_at IS NULL por padrão? 5. Endpoint
