version: 1
plan:
  name: cartorio-g01-grafana-dashboard
  max_concurrency: 1
  max_consecutive_failures: 2
  max_cycles: 2
  auto_accept: true
  auto_reject_retries: 1
  verifier_config:
    default_verifiers:
