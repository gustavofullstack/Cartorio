# GitHub Actions — Deploy (G6.J.T6)
# Trigger:
#   - push em master (deploy automatico para staging)
#   - tag v* (deploy para prod)
#   - manual workflow_dispatch (com environment choice)
#
# Requer secrets:
#   - VPS_HOST (187.77.236.77)
#   - VPS_USER (root ou cartorio)
#   - VPS_SSH_KEY (private key para SSH via Tailscale)
#   - DEPLOY_WEBHOOK (opcional, Telegram GRUPO PIETRA notification)
#
# Fluxo:
#   1. roda pytest + mypy + ruff (gate de qualidade)
#   2. roda G6 scripts (coverage, openapi, n8n validator, secrets scan)
#   3. SSH na VPS e roda git pull + docker compose up
#   4. Smoke test (curl /health)
#   5. Notifica Telegram GRUPO PIETRA (se sucesso OU falha)

name: Deploy

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.11"

jobs:
  # ============================================================================
  # Stage 1: Quality gates (reutiliza do ci.yml)
  # ============================================================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Mypy typecheck
        working-directory: backend
        run: rm -rf .mypy_cache && uv run mypy app/

      - name: Pytest (parallel xdist)
        working-directory: backend
        run: uv run pytest -n auto --tb=short

      - name: G6 scripts (CI gates)
        run: |
          echo "=== N8N workflow validator ==="
          python3 scripts/n8n_workflow_validator.py
          echo "=== OpenAPI snapshot check ==="
          python3 scripts/openapi_snapshot.py --check
          echo "=== Tracked secrets inventory (redacted, report-only) ==="
          python3 backend/scripts/check_no_literal_keys.py \
            --tracked-files --severity critical --report-only \
            --report "$RUNNER_TEMP/tracked-secrets-report.md"

  # ============================================================================
  # Stage 2: Deploy (so roda se quality passar)
  # ============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git log

      - name: Determine commit info
        id: commit
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add Tailscale host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e
            echo "=== Git pull ==="
            cd /home/cartorio/Cartorio
            git pull origin master
            echo "=== Short SHA: $(git rev-parse --short HEAD) ==="

            echo "=== Backend deps ==="
            cd backend
            uv sync --all-extras --quiet

            echo "=== Run migrations (se houver) ==="
            uv run alembic upgrade head || echo "Alembic migrations skipped (sem env)"

            echo "=== Restart backend container ==="
            cd ..
            docker compose -f infra/docker-compose.yml restart backend || true

            echo "=== Restart N8N container ==="
            docker compose -f infra/docker-compose.yml restart n8n || true

            echo "=== Restart OpenClaw container (se houver) ==="
            docker compose -f infra/docker-compose.yml restart openclaw || true

            echo "=== Health check ==="
            sleep 10
            curl -sf https://api.2notasudi.com.br/health || echo "API health check failed"
          EOF

      - name: Notify Telegram on failure
        if: failure()
        env:
          MSG: |
            🚨 DEPLOY FAILED
            Commit: ${{ steps.commit.short_sha }}
            Message: ${{ steps.commit.message }}
            Run: ${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

      - name: Notify Telegram on success
        if: success()
        env:
          MSG: |
            ✅ DEPLOY SUCCESS
            Commit: ${{ steps.commit.short_sha }}
            Message: ${{ steps.commit.message }}
            Environment: ${{ github.event.inputs.environment || 'staging' }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

  # ============================================================================
  # Stage 3: Smoke test (rodar contra prod apos deploy)
  # ============================================================================
  smoke:
    name: Smoke test prod
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check
        run: |
          echo "=== API ==="
          curl -sk -o /dev/null -m 10 -w "HTTP %{http_code} in %{time_total}s\n" https://api.2notasudi.com.br/health
          echo "=== Flow (N8N) ==="
          curl -sk -o /dev/null -m 10 -w "HTTP %{http_code} in %{time_total}s\n" https://flow.2notasudi.com.br/healthz
          echo "=== Radar ==="
          curl -sk -o /dev/null -m 10 -w "HTTP %{http_code} in %{time_total}s\n" https://api.2notasudi.com.br/api/v1/health/radar/expanded || true
          echo "=== OpenClaw ==="
          curl -sk -o /dev/null -m 10 -w "HTTP %{http_code} in %{time_total}s\n" https://agent.2notasudi.com.br/health || true

      - name: Workflow validator smoke
        run: python3 scripts/n8n_workflow_validator.py 2>&1 | tail -3
