# GitHub Actions - E2E Playwright (F05 v2 — manual-only)
#
# Suite Playwright que exercita o fluxo cliente ponta-a-ponta:
#   cliente novo -> protocolo DRAFT -> agendamento -> atendimento ->
#   emolumento -> documento -> soft delete (A19) -> consentimento LGPD
#
# ATIVACAO: este workflow eh MANUAL-ONLY (apenas `workflow_dispatch`).
# NAO tem `on.schedule` (removido em v2 — feedback verifier attempt 1).
# Ate Gustavo GO explicito para ativar cron schedule, este workflow
# NAO roda sozinho — apenas sob trigger manual via UI do GitHub.
#
# Razao: suite E2E custa ~5min single-browser (chromium launch + 6 tests).
# Rodar em todo PR inflaria custo Free Tier GH Actions. Rodar nightly
# exige GH_PAT + E2E_API_KEY_AUDIT_HMAC secrets no repo — ainda NAO
# configurado.
#
# Pre-requisitos para ativar nightly:
#   1. Adicionar secrets no repo:
#      - E2E_API_KEY_ADMIN (X-API-Key admin)
#      - AUDIT_HMAC_KEY_E2E (HMAC match do backend prod)
#      - DATABASE_URL_E2E (Postgres test OU SQLite in-memory)
#   2. Trocar `false` por `true` no trigger on.schedule abaixo.
#   3. Gustavo GO explicito.
#
# Para rodar suite localmente:
#   cd backend && uv sync --extra e2e && playwright install chromium
#   E2E_BASE_URL=http://localhost:8000 pytest -m e2e --browser chromium -v

name: E2E Playwright (Manual)

on:
  # APENAS manual trigger (feedback verifier v2: SEM on.schedule).
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: "Base URL da API sob test (default: localhost:8000)"
        required: false
        default: "http://localhost:8000"
      branch:
        description: "Branch a testar (default: master)"
        required: false
        default: "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.11"

jobs:
  e2e-suite:
    name: Playwright E2E suite (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # suite ~5min + buffer

    env:
      E2E_BASE_URL: ${{ github.event.inputs.e2e_base_url || 'http://localhost:8000' }}
      # API key admin (X-API-Key header). Default 'a' * 64 so funciona em dev/test.
      E2E_API_KEY_ADMIN: ${{ secrets.E2E_API_KEY_ADMIN || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      E2E_API_KEY_CLIENT: ${{ secrets.E2E_API_KEY_CLIENT || secrets.E2E_API_KEY_ADMIN || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      # Chromium deps (libs necessarias em Ubuntu runner).
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'master' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/.venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml', 'backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies (incl. e2e extra)
        working-directory: backend
        run: uv sync --extra e2e

      # ========================================================================
      # Step 1: Install chromium binary via Playwright CLI.
      # Cache para evitar download 200MB toda run.
      # ========================================================================
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: /ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium + deps
        working-directory: backend
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium

      # ========================================================================
      # Step 2: Smoke health check (NAO marker e2e, captura drift cedo).
      # v2: NAO usa pytest.importorskip (feedback verifier attempt 1).
      # ========================================================================
      - name: Run e2e_health smoke (drift detection, no importorskip)
        working-directory: backend
        run: |
          uv run pytest tests/test_e2e_health.py -v --tb=short --no-cov

      # ========================================================================
      # Step 3: Run E2E suite completa.
      # Playwright plugin auto-usa --browser chromium (configurado em browser_type_launch_args).
      # ========================================================================
      - name: Run E2E suite (Playwright + chromium)
        working-directory: backend
        run: |
          uv run pytest tests/e2e/ \
            --browser chromium \
            -m e2e \
            --junitxml=e2e-report.xml \
            --tb=short \
            -v \
            2>&1 | tee e2e-run.log

      # ========================================================================
      # Step 4: Upload artifacts (report + log).
      # ========================================================================
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            backend/e2e-report.xml
            backend/e2e-run.log
          retention-days: 14

      # ========================================================================
      # Step 5: Report status no job summary.
      # ========================================================================
      - name: Summary
        if: always()
        run: |
          if [ -f backend/e2e-report.xml ]; then
            echo "## E2E Suite Results" >> $GITHUB_STEP_SUMMARY
            grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' \
              backend/e2e-report.xml | head -1 >> $GITHUB_STEP_SUMMARY || true
          else
            echo "## E2E Suite Results" >> $GITHUB_STEP_SUMMARY
            echo "Report NAO gerado — suite falhou antes do junit export." >> $GITHUB_STEP_SUMMARY
          fi