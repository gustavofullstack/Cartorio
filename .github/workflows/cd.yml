# CD - Conditional deploy on absolute quality gates
# Deploy (Render API + polling) roda SOMENTE apos todos os CI jobs passarem:
# lint, mypy, test (pytest + coverage 90%), secrets-scan, docs-build.
#
# G8.14.T2 — quality-gate job eh o unico elo entre CI e CD.
# Fall-back seguro: se QUALQUER job falhar OU for cancelado OU pular,
# deploy NAO dispara (fail-safe).
#
# Secrets (Settings > Secrets and variables > Actions):
#   RENDER_API_KEY    = (NAO comitar)
#   RENDER_SERVICE_ID = srv-d8u04aojs32c73c92j8g
#   GH_TOKEN          = (auto via ${{ secrets.GITHUB_TOKEN }})

name: CD

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/cd.yml'
      - '.github/workflows/ci.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:  # permite disparar manualmente (emergency only — bypass de gate)

# Cancela deploys obsoletos (mesmo commit)
concurrency:
  group: cd-render
  cancel-in-progress: false  # NAO cancelar deploy em andamento

env:
  RENDER_SERVICE_ID: srv-d8u04aojs32c73c92j8g

jobs:
  # ============================================================================
  # QUALITY GATE ABSOLUTO (G8.14.T2)
  # So permite deploy se TODOS os gates de CI passaram.
  # ============================================================================
  quality-gate:
    name: Quality Gate Absolute
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: CI  # trigger implicito: aguarda CI rodar e concluir
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Setup Python
        run: uv python install "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      # GATE 1: lint (ruff check + format)
      - name: Gate 1/6 — Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Gate 2/6 — Ruff format
        working-directory: backend
        run: uv run ruff format --check .

      # GATE 2: mypy strict
      - name: Gate 3/6 — Mypy typecheck strict
        working-directory: backend
        run: rm -rf .mypy_cache && uv run mypy app/

      # GATE 3: pytest + coverage 90%
      - name: Gate 4/6 — Pytest (coverage gate 90%)
        working-directory: backend
        env:
          APP_ENV: testing
        run: uv run pytest -n auto --tb=short

      # GATE 4: secrets scan (literal API keys)
      - name: Gate 5/6 — Secrets literal keys scan
        run: python3 backend/scripts/check_no_literal_keys.py

      # GATE 5: PII leak check (LGPD core — teste de PII scrubbing)
      - name: Gate 6/6 — LGPD PII scrubbing test
        working-directory: backend
        run: uv run pytest tests/test_pii.py --no-cov -v

      # GATE 6: composite G7 super validator (soft check)
      - name: G7 super validator (local-only)
        run: |
          set +e
          python3 scripts/g7_super_validator.py --skip-ruff --skip-pytest --json > /tmp/g7_cd.json
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then
            cat /tmp/g7_cd.json || true
            exit 2
          fi
          echo "G7 validator OK (exit=$code)"

      - name: All quality gates GREEN
        run: |
          echo "ALL 6 GATES GREEN — proceeding to deploy"
          echo "Gate 1/6 Ruff lint:    OK"
          echo "Gate 2/6 Ruff format:  OK"
          echo "Gate 3/6 Mypy strict:  OK"
          echo "Gate 4/6 Pytest 90%:   OK"
          echo "Gate 5/6 Secrets scan: OK"
          echo "Gate 6/6 LGPD PII:     OK"

  # ============================================================================
  # DEPLOY (Render) — so roda se quality-gate OK
  # ============================================================================
  deploy-render:
    name: Deploy to Render (Ohio, free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-gate]
    if: ${{ needs.quality-gate.result == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger deploy via Render API
        id: trigger
        run: |
          RESP=$(curl -sS -X POST \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\n%{http_code}")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Render trigger failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Poll until live (max 5min)
        id: poll
        run: |
          for i in $(seq 1 30); do
            RESP=$(curl -sS \
              "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys?limit=1" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
            STATUS=$(echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0].get('status','unknown'))")
            echo "[$i/30] status=$STATUS"
            if [ "$STATUS" = "live" ]; then
              DEPLOY_URL=$(echo "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0].get('deploy',{}).get('url',''))")
              echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "deactivated" ]; then
              echo "::error::Render deploy terminal status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timeout waiting for deploy to go live"
          exit 1

      - name: Comment on PR (if any)
        if: steps.poll.outputs.deploy_url != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base master --limit 1 --json number -q '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body \
              "Deploy Render OK: ${{ steps.poll.outputs.deploy_url }}"
          fi

      - name: Report failure as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## CD failure', '',
              'Commit: ' + process.env.GITHUB_SHA, '',
              'Run: ' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID, '',
              'Veja os logs e o dashboard do Render (servico Ohio).'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CD: Render deploy failed (' + new Date().toISOString().slice(0,10) + ')',
              body,
              labels: ['ci','deploy']
            });
