# GitHub Actions - CI para Cartorio Chatbot
# Roda em TODOS os PRs e em push para master.
# Gates: ruff + mypy + pytest com coverage 90%.
#
# Para ativar: settings do repo > Secrets > N8N_API_KEY (se testes precisarem)

name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:  # permite rodar manualmente

# Cancela runs antigos da mesma branch para economizar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.11"

jobs:
  # ============================================================================
  # Secrets scan (gitleaks + literal keys) — gate 0 (mais rapido)
  # Roda PRIMEIRO pra bloquer PR com credenciais antes do lint pesado.
  # G8.14.T3 (Wave 48 — LGPD-by-design): 20 patterns + baseline whitelist.
  # ============================================================================
  secrets-scan:
    name: Secrets scan (gitleaks + literal keys)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (full history baseline)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_HISTORY: false  # full scan eh lento, on-demand only

      # G8.14.T3: literal keys scanner LGPD Art. 46.
      # Detecta 20 patterns (AWS, OpenAI, Anthropic, Telegram, Supabase,
      # MiniMax, GCP SA, PKCS8, JWT, etc.) com severity threshold + baseline
      # whitelist de FPs conhecidos (chaves queimadas em chat, placeholders).
      - name: Literal keys scanner (LGPD Art. 46 — G8.14.T3)
        run: |
          python3 backend/scripts/check_no_literal_keys.py \
            --severity critical \
            --baseline backend/scripts/check_no_literal_keys.baseline

  # ============================================================================
  # Lint + Typecheck (gate rapido - 2-3min)
  # ============================================================================
  lint:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: secrets-scan  # so roda apos secrets-scan passar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # uv e o cache primario; pip fica disponivel para ferramentas Python auxiliares.
      - name: Install uv with dependency cache
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/uv.lock

      # Estado incremental muda com fontes/config, sem invalidar wheels do cache uv.
      - name: Cache lint and typecheck state
        uses: actions/cache@v4
        with:
          path: |
            backend/.mypy_cache
            backend/.ruff_cache
          key: ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-quality-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'backend/app/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-quality-

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy typecheck (incremental cache)
        working-directory: backend
        run: uv run mypy app/

      # A23 - valida OpenAPI spec contra openapi-spec-validator (Sprint 4)
      - name: OpenAPI spec validation (A23)
        working-directory: backend
        run: |
          uv run python -c "
          import urllib.request, json, sys
          from openapi_spec_validator import validate_spec
          from openapi_spec_validator.readers import read_from_filename
          spec_dict, _ = read_from_filename('openapi.json') if __import__('os').path.exists('openapi.json') else ({}, None)
          if not spec_dict:
              print('openapi.json nao encontrado, pulando validacao estatica')
              sys.exit(0)
          validate_spec(spec_dict)
          print('OpenAPI spec OK')
          "
        continue-on-error: true  # WARN-only ate app gerar openapi.json

  # ============================================================================
  # Tests (gate principal - 5-8min)
  # ============================================================================
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint  # so roda apos lint passar

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cartorio_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cartorio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://cartorio_test:test_password@localhost:5432/cartorio_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # uv e o cache primario; pip fica disponivel para ferramentas Python auxiliares.
      - name: Install uv with dependency cache
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/uv.lock

      # Pytest metadata e relatorio HTML ficam separados do cache de dependencias.
      - name: Cache pytest artifacts
        uses: actions/cache@v4
        with:
          path: |
            backend/.pytest_cache
            backend/htmlcov/
          key: ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-pytest-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'backend/app/**/*.py', 'backend/tests/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-pytest-

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run pytest with coverage (parallel xdist)
        working-directory: backend
        run: uv run pytest -n auto --tb=short

      # G6.A.T2 — OpenAPI snapshot CI gate
      - name: OpenAPI snapshot check (G6.A.T2)
        run: python3 scripts/openapi_snapshot.py --check

      # G6.B.T1 — N8N workflow validator CI gate
      - name: N8N workflow validator (G6.B.T1)
        run: python3 scripts/n8n_workflow_validator.py

      # G6.A.T5 — Coverage gate fail-safe
      - name: Coverage gate (G6.A.T5)
        working-directory: backend
        run: cd .. && python3 scripts/coverage_gate.py

      # G7.21.T4 — no bare raise Exception(
      - name: Bare Exception gate (G7.21.T4)
        run: python3 scripts/check_no_bare_exception.py

      # G7.22.T4 — secrets pattern scan (non-blocking until baseline clean)
      - name: Secrets scan (G7.22.T4)
        run: |
          if [ -f scripts/secrets_scan.py ]; then
            python3 scripts/secrets_scan.py --all-files || echo "WARN secrets_scan exit non-zero (review)"
          else
            echo "secrets_scan.py missing — skip"
          fi

      # G7.22.T1 — composite local artifacts (prod radar HOLD expected in CI)
      - name: G7 super validator local-only (G7.22.T1)
        run: |
          set +e
          python3 scripts/g7_super_validator.py --skip-ruff --skip-pytest --json > /tmp/g7_ci.json
          code=$?
          set -e
          # exit 2 = hard fail local; exit 1 = HOLD prod (expected in CI)
          if [ "$code" -ge 2 ]; then
            cat /tmp/g7_ci.json || true
            exit 2
          fi
          echo "G7 validator CI ok (exit=$code — HOLD prod allowed)"
          python3 -c "import json; d=json.load(open('/tmp/g7_ci.json')); print(d.get('overall'), list(d.get('checks',{}).keys()))"

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: backend/.coverage
          flags: unittests
          name: cartorio-backend
          fail_ci_if_error: false  # nao bloqueia CI se codecov falhar

  # ============================================================================
  # Docs / Build (verifica que build nao quebra)
  # ============================================================================
  docs-build:
    name: Docs + CHANGELOG sanity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check CHANGELOG.md exists and is non-empty
        run: |
          if [ ! -s docs/CHANGELOG.md ]; then
            echo "ERROR: docs/CHANGELOG.md is missing or empty"
            exit 1
          fi
          echo "CHANGELOG OK: $(wc -l < docs/CHANGELOG.md) lines"

      - name: Check README.md exists
        run: |
          if [ ! -s README.md ]; then
            echo "ERROR: README.md is missing or empty"
            exit 1
          fi

      - name: Check all ADRs have status field
        run: |
          for f in docs/adr/*.md; do
            if ! grep -q "^\*\*Status\*\*" "$f"; then
              echo "WARN: $f missing Status field"
            fi
          done
          echo "ADRs OK"

  # ============================================================================
  # SUMMARY
  # ============================================================================
  all-green:
    name: All CI Gates Pass
    runs-on: ubuntu-latest
    needs: [secrets-scan, lint, test, docs-build]
    if: ${{ success() }}
    timeout-minutes: 1
    steps:
      - name: All checks passed
        run: |
          echo "ALL CI GATES PASSED"
          echo "- secrets-scan (gitleaks): OK"
          echo "- lint (ruff + mypy): OK"
          echo "- test (pytest + coverage 90%): OK"
          echo "- docs (CHANGELOG + README + ADR status): OK"
          echo "PR pode ser mergeado. CD quality-gate vai disparar automaticamente."
